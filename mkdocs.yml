site_name: Rocket Wiki

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md

  - 航电系统: avionics/index.md
  - 结构设计: structures/index.md
  - 推进系统: propulsion/index.md

  - 仿真分析:
      - 概述: simulation/index.md

  - 飞行记录: flight_records/index.md
  
  - 开发规范: development/index.md

  - 鬼话: mad/index.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true

        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Total
            航电系统: Avionics
            结构设计: Structures
            推进系统: Propulsion

            仿真分析:
                概述: Simulation

            飞行记录: Flight Records
              
            开发规范: Development

            鬼话: Mad